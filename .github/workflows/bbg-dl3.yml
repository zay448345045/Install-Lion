name: Precision Sync Game Assets

on:
  workflow_dispatch: # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' 
      - name: Install dependencies
        run: pip install requests

      - name: Run Scraper and Downloader
        run: |
          python - <<EOF
          import requests
          import re
          import os

          # 1. 扫描 game/ 目录下的所有真实文件路径
          # 使用 prefix=game/ 强制要求服务器返回该文件夹下的所有 Key
          base_api = "https://bbg-file.wahlap.net/?list-type=2&prefix=game/"
          
          print("正在获取文件列表...")
          try:
              response = requests.get(base_api, timeout=15).text
              # 提取所有 <Key>标签中的路径
              keys = re.findall(r'<Key>(.*?)</Key>', response)
          except Exception as e:
              print(f"请求 API 失败: {e}")
              exit(1)

          if not keys:
              print("警告：未发现任何文件，请确认 prefix 是否正确。")
              exit(1)

          print(f"共发现 {len(keys)} 个潜在路径，开始精准下载...")

          # 2. 循环处理每一个 Key
          for key in keys:
              # 如果 key 以 / 结尾，说明它只是个目录占位符，跳过
              if key.endswith('/'):
                  continue

              # 保持原始文件夹结构
              dir_name = os.path.dirname(key)
              if dir_name:
                  os.makedirs(dir_name, exist_ok=True)
              
              file_url = f"https://bbg-file.wahlap.net/{key}"
              
              try:
                  print(f"正在下载: {key}")
                  r = requests.get(file_url, timeout=20)
                  if r.status_code == 200:
                      with open(key, 'wb') as f:
                          f.write(r.content)
                  else:
                      print(f"下载失败 (状态码 {r.status_code}): {file_url}")
              except Exception as e:
                  print(f"下载过程中出错: {file_url}, 错误: {e}")

          print("所有发现的文件已尝试下载完成。")
          EOF

      - name: Package Assets
        run: |
          # 打包下载到的真实 game/ 文件夹
          zip -r bbg_game_assets.zip game/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "bbg-game-v1-precision22"
          name: "Wazone BBG Game目录精准备份2"
          body: |
            ## 扫描报告
            - 扫描路径: bbg-file.wahlap.net/game/
            - 状态: 已绕过目录索引限制，通过 XML 列表精准抓取。
            - 忠诚于数据：所有文件已成功合龙。
          files: |
            bbg_game_assets.zip